<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho PDI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <p id="time" class="absolute top-[8px] text-[#c5c6c7] left-[12px]">0.0s</p>
    <div class="flex w-[100%] bg-[#0b0c10] h-[100svh]">
        <div class="flex flex-col w-[80%] px-2">
            <div id="camera" class="h-[80%] mt-[8px]">
                <img id="image" class="h-[95%] w-[100%] object-contain border-1 border-[#c5c6c7] rounded-[4px]">
            </div>
            <div id="filters" class="overflow-y-auto flex border-1 border-[#c5c6c7] py-2 px-4 rounded-[4px]">
                <div onclick="toggleCamera()" class="shrink-[0] rounded-[4px] cursor-pointer w-[32px] bg-[#1f2833] h-[128px]">
                    <p class="[writing-mode:sideways-lr] text-[#c5c6c7] relative top-[64px] translate-y-[-50%] left-[16px] translate-x-[-50%]">Video</p>
                </div>
                <div onclick="selectImage()" class="shrink-[0] rounded-[4px] cursor-pointer w-[32px] bg-[#1f2833] h-[128px] ml-[8px] mr-[8px]">
                    <p class="[writing-mode:sideways-lr] text-[#c5c6c7] relative top-[64px] translate-y-[-50%] left-[16px] translate-x-[-50%]">Image</p>
                </div>
            </div>
        </div>
        <div class="flex flex-col justify-center items-center w-[20%]">
            <button onclick="setFilter('Grayscale')" class="cursor-pointer outline-0 w-[196px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Grayscale</button>
            <button onclick="setFilter('Negative')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Negative</button>
            <button onclick="setFilter('Threshold')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Threshold</button>
            <input type="number" id="kernelThreshold" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Threshold" min="0" max="255">
            <button onclick="setFilter('Otsu')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Otsu</button>
            <button onclick="setFilter('Mean')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Mean Smoothing</button>
            <input type="number" id="kernelMean" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Kernel" min="2" max="100">
            <button onclick="setFilter('Median')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Median Smoothing</button>
            <input type="number" id="kernelMedian" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Kernel" min="2" max="100">
            <button onclick="setFilter('Canny')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Canny</button>
            <input type="number" id="canny1" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Threshold 1" min="0" max="255">
            <input type="number" id="canny2" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Threshold 2" min="0" max="255">
            <button id="canny3" onclick="addFilter('Canny', [canny1, canny2])" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833] hidden">Confirm</button>
            <button onclick="setFilter('Erode')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Erode</button>
            <input type="number" id="kernelErode" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Kernel" min="2" max="100">
            <button onclick="setFilter('Dilate')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Dilate</button>
            <input type="number" id="kernelDilate" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Kernel" min="2" max="100">
            <button onclick="setFilter('Opening')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Opening</button>
            <input type="number" id="kernelOpening" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Kernel" min="2" max="100">
            <button onclick="setFilter('Closing')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Closing</button>
            <input type="number" id="kernelClosing" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Kernel" min="2" max="100">
            <button onclick="setFilter('Histogram')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-1 text-[#c5c6c7] bg-[#1f2833]">Histogram</button>
            <div id="hist" class="hidden">
                <input type="checkbox" id="hist1"><label for="hist1" class="text-[#c5c6c7] ml-[4px]">Cumulative</label>
                <input type="checkbox" id="hist2"><label for="hist2" class="text-[#c5c6c7] ml-[4px]">Normalized</label>
            </div>
            <button id="hist3" onclick="addFilter('Histogram', [hist1, hist2])" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-2 text-[#c5c6c7] bg-[#1f2833] hidden">Confirm</button>
            <button onclick="setFilter('Area')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-2 text-[#c5c6c7] bg-[#1f2833]">Area</button>
            <input type="number" id="kernelArea" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Pixel Size" min="0" max="255">
            <button onclick="setFilter('Perimeter')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-2 text-[#c5c6c7] bg-[#1f2833]">Perimeter</button>
            <input type="number" id="kernelPerimeter" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Pixel Size" min="0" max="255">
            <button onclick="setFilter('Diameter')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-2 text-[#c5c6c7] bg-[#1f2833]">Diameter</button>
            <input type="number" id="kernelDiameter" class="outline-0 margin-0 w-[196px] mt-[8px] bg-[#1f2833] text-[#c5c6c7] text-right rounded-[4px] hidden" placeholder="Pixel Size" min="0" max="255">
            <button onclick="setFilter('Counting')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-2 text-[#c5c6c7] bg-[#1f2833]">Object Counting</button>
            <button onclick="setFilter('Tracking')" class="cursor-pointer outline-0 w-[196px] mt-[8px] rounded-[4px] px-4 py-2 text-[#c5c6c7] bg-[#1f2833]">Object Tracking</button>
        </div>
    </div>
    <input type="file" id="imageUpload" class="hidden" accept="image/*">

    <script>
        var canny1 = 5;
        var canny2 = 50;
        var hist1 = false;
        var hist2 = false;
        var filters = [];

        var imageUpload = document.getElementById("imageUpload");

        imageUpload.addEventListener('change', updateImage);
        document.getElementById("kernelMean").addEventListener('change', (e) => {addFilter("Mean", [parseInt(e.target.value)])});
        document.getElementById("kernelMedian").addEventListener('change', (e) => {addFilter("Median", [parseInt(e.target.value)])});
        document.getElementById("kernelErode").addEventListener('change', (e) => {addFilter("Erode", [parseInt(e.target.value)])});
        document.getElementById("kernelDilate").addEventListener('change', (e) => {addFilter("Dilate", [parseInt(e.target.value)])});
        document.getElementById("kernelOpening").addEventListener('change', (e) => {addFilter("Opening", [parseInt(e.target.value)])});
        document.getElementById("kernelClosing").addEventListener('change', (e) => {addFilter("Closing", [parseInt(e.target.value)])});
        document.getElementById("kernelArea").addEventListener('change', (e) => {addFilter("Area", [parseInt(e.target.value)])});
        document.getElementById("kernelPerimeter").addEventListener('change', (e) => {addFilter("Perimeter", [parseInt(e.target.value)])});
        document.getElementById("kernelDiameter").addEventListener('change', (e) => {addFilter("Diameter", [parseInt(e.target.value)])});
        document.getElementById("kernelThreshold").addEventListener('change', (e) => {addFilter("Threshold", [parseInt(e.target.value)])});
        document.getElementById("canny1").addEventListener('change', (e) => {canny1 = parseInt(e.target.value)});
        document.getElementById("canny2").addEventListener('change', (e) => {canny2 = parseInt(e.target.value)});
        document.getElementById("hist1").addEventListener('change', (e) => {hist1 = e.target.checked});
        document.getElementById("hist2").addEventListener('change', (e) => {hist2 = e.target.checked});

        var ws = new WebSocket("ws:localhost:8080");
        ws.addEventListener("message", (data) => {
            imageObj.src = URL.createObjectURL(data.data);
            clearInterval(sendInterval);
            sendInterval = null;
            if(stream){
                requestAnimationFrame(sendVideoToServer);
            }
        });
        ws.addEventListener("open", () => {
            ws.send(new Uint8Array([0]));
        });
        var videoInterval = null;
        var sendInterval = null;
        var sendTimer = 0;
        var pTimer = document.getElementById("time");

        function setTimer(ms){
            sendTimer += ms/1000;
            pTimer.innerText = (Math.round(sendTimer * 100) / 100).toFixed(1);
            pTimer.innerText += "s";
        }

        var stream = null;
        var videoObj = document.createElement("video");
        videoObj.setAttribute("autoplay", true);
        videoObj.setAttribute("muted", true);
        var imageObj = document.getElementById("image");
        async function toggleCamera(){
            if(stream){
                stream.getTracks().forEach(track => track.stop());
                videoObj.srcObject = null;
                stream = null;

                clearInterval(videoInterval);
                videoInterval = null;
            }else{
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    videoObj.srcObject = stream;

                    imageUpload.value = '';
                    
                    requestAnimationFrame(sendVideoToServer);
                } catch (err) {
                    console.error('Error starting camera:', err);
                }
            }
        }

        function selectImage(){
            if(stream){
                stream.getTracks().forEach(track => track.stop());
                videoObj.srcObject = null;
                stream = null;

                clearInterval(videoInterval);
                videoInterval = null;
            }
            document.getElementById('imageUpload').click();
        }

        function sendData(image, type){
            const reader = new FileReader();
            reader.onload = () => {
                const fileData = new Uint8Array(reader.result);
                const data = new Uint8Array(fileData.length + 1);
                data[0] = type;
                data.set(fileData, 1);

                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(data);

                    clearInterval(sendInterval);
                    sendTimer = 0;
                    sendInterval = setInterval(() => setTimer(100), 100);
                }
            }
            reader.readAsArrayBuffer(image);
        }

        function updateImage(){
            let files = imageUpload.files;
            if(files.length > 0){
                sendData(files[0], 1);
            }
        }

        function loadFilter(e, idx){
            e.preventDefault();
            if(e.button == 1 || (e.button == 0 && e.shiftKey)){
                filters[idx] = null;
                if(e.target.tagName == 'P'){
                    e.target.parentElement.remove();
                }else{
                    e.target.remove();
                }
                if(document.getElementById("filters").children.length == 2){
                    filters = [];
                }
                sendFilters();
            }else{
                hide();
                if(["Mean", "Median", "Canny", "Erode", "Dilate", "Opening", "Closing", "Area", "Perimeter", "Diameter", "Histogram", "Threshold"].indexOf(filters[idx][0]) > -1){
                    if(filters[idx][0] == "Canny"){
                        let canny1Obj = document.getElementById("canny1");
                        let canny2Obj = document.getElementById("canny2");
                        canny1Obj.classList.remove("hidden");
                        canny2Obj.classList.remove("hidden");
                        document.getElementById("canny3").classList.remove("hidden");
                        canny1Obj.value = `${filters[idx][1][0]}`;
                        canny2Obj.value = `${filters[idx][1][1]}`;
                    }else if(filters[idx][0] == "Histogram"){
                        document.getElementById("hist").classList.remove("hidden");
                        document.getElementById("hist3").classList.remove("hidden");
                        document.getElementById("hist1").checked = filters[idx][1][0];
                        document.getElementById("hist2").checked = filters[idx][1][1];
                    }else{
                        document.getElementById(`kernel${filters[idx][0]}`).classList.remove("hidden");
                        document.getElementById(`kernel${filters[idx][0]}`).value = `${filters[idx][1][0]}`;
                    }
                }
            }
        }

        function addFilter(filter, values){
            let div = document.createElement('div');
            let p = document.createElement('p');
            div.setAttribute('class', "shrink-[0] rounded-[4px] cursor-pointer w-[32px] bg-[#1f2833] h-[128px] ml-[8px]");
            p.setAttribute('class', "[writing-mode:sideways-lr] text-[#c5c6c7] relative top-[64px] translate-y-[-50%] left-[16px] translate-x-[-50%]");
            p.innerText = filter;
            div.appendChild(p);
            let size = filters.length;
            div.onclick = function(e){loadFilter(e, size);};
            filters.push([filter, values])
            sendFilters();
            document.getElementById("filters").appendChild(div);
        }

        function hide(){
            document.getElementById("kernelMean").classList.add("hidden");
            document.getElementById("kernelMedian").classList.add("hidden");
            document.getElementById("kernelErode").classList.add("hidden");
            document.getElementById("kernelDilate").classList.add("hidden");
            document.getElementById("kernelOpening").classList.add("hidden");
            document.getElementById("kernelClosing").classList.add("hidden");
            document.getElementById("kernelArea").classList.add("hidden");
            document.getElementById("kernelPerimeter").classList.add("hidden");
            document.getElementById("kernelDiameter").classList.add("hidden");
            document.getElementById("kernelThreshold").classList.add("hidden");
            document.getElementById("canny1").classList.add("hidden");
            document.getElementById("canny2").classList.add("hidden");
            document.getElementById("canny3").classList.add("hidden");
            document.getElementById("hist").classList.add("hidden");
            document.getElementById("hist3").classList.add("hidden");
        }

        function setFilter(filter){
            hide();
            if(["Mean", "Median", "Canny", "Erode", "Dilate", "Opening", "Closing", "Area", "Perimeter", "Diameter", "Histogram", "Threshold"].indexOf(filter) > -1){
                if(filter == "Canny"){
                    document.getElementById("canny1").classList.remove("hidden");
                    document.getElementById("canny2").classList.remove("hidden");
                    document.getElementById("canny3").classList.remove("hidden");
                }else if(filter == "Histogram"){
                    document.getElementById("hist3").classList.remove("hidden");
                    document.getElementById("hist").classList.remove("hidden");
                }else{
                    document.getElementById(`kernel${filter}`).classList.remove("hidden");
                }
            }else{
                addFilter(filter, [0, 0]);
            }
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        function sendVideoToServer(){
            ctx.drawImage(videoObj, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
                if (!blob) return;
                sendData(blob, 2);
            }, 'image/png');
            // if(stream){
            //     requestAnimationFrame(sendVideoToServer);
            // }
        }

        var func2byte = {
            "Grayscale": 0,
            "Negative": 1,
            "Otsu": 2,
            "Mean": 3,
            "Median": 4,
            "Canny": 5,
            "Erode": 6,
            "Dilate": 7,
            "Opening": 8,
            "Closing": 9,
            "Histogram": 10,
            "Area": 11,
            "Perimeter": 12,
            "Diameter": 13,
            "Counting": 14,
            "Threshold": 15,
            "Tracking": 16
        };
        function sendFilters(){
            let filtersWithoutNone = [];
            filters.forEach(element => {
                if(element != null){
                    filtersWithoutNone.push(element);
                }
            });
            let data = new Uint8Array(filtersWithoutNone.length*3 + 1);
            let idx = 1;
            data[0] = 0;
            filtersWithoutNone.forEach(element => {
                data[idx] = func2byte[element[0]];
                if(data[idx] == 10){
                    data[idx+1] = (element[1][0]) ? 1 : 0;
                    data[idx+2] = (element[1][1]) ? 1 : 0;
                }else{
                    data[idx+1] = element[1][0];
                    data[idx+2] = element[1][1];
                }
                idx += 3;
            });
            if(ws.readyState == WebSocket.OPEN){
                ws.send(data);
                if(imageUpload.files.length > 0){
                    clearInterval(sendInterval);
                    sendTimer = 0;
                    sendInterval = setInterval(() => setTimer(100), 100);
                }
            }
        }
    </script>
</body>
</html>
