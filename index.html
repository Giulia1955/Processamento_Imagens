<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Workshop | PDI</title>
    <style>
        :root {
            --graphite: #101719;
            --graphite-soft: #172225;
            --teal-surface: #1d3435;
            --teal-raised: #264445;
            --mint: #9ee8c4;
            --mint-strong: #6bd4a5;
            --soft-text: #f1f5ef;
            --muted-text: #a5b7b1;
            --coral: #f28c82;
            --line: #3d5a58;
            --shadow: rgba(0, 0, 0, 0.22);
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { margin: 0; background: var(--graphite); color: var(--soft-text); font-family: "Trebuchet MS", "Gill Sans", sans-serif; }
        button, input { font: inherit; }
        button { min-height: 42px; border: 1px solid transparent; border-radius: 6px; padding: 0.65rem 0.8rem; color: var(--soft-text); background: var(--teal-raised); cursor: pointer; transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease; }
        button:hover { background: #315553; border-color: var(--mint-strong); }
        button:active { background: var(--mint-strong); color: var(--graphite); }
        button:disabled { cursor: not-allowed; opacity: 0.48; }
        button:focus-visible, input:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
        .app-shell { width: min(1480px, 100%); min-height: 100svh; margin: 0 auto; padding: 1.25rem clamp(1rem, 3vw, 2.5rem) 1.5rem; display: grid; grid-template-rows: auto minmax(420px, 1fr) auto auto; gap: 1rem; }
        .app-header { display: grid; grid-template-columns: minmax(220px, 1fr) auto auto; align-items: center; gap: 1rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 0.75rem; }
        .brand-mark { display: grid; place-items: center; min-width: 52px; min-height: 32px; border: 1px solid var(--mint); border-radius: 4px; color: var(--mint); font-weight: 700; letter-spacing: 0.12em; }
        h1, h2, h3, p { margin: 0; }
        h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; }
        h1 { font-size: clamp(1.2rem, 2vw, 1.65rem); }
        h2 { font-size: 1.1rem; }
        h3 { font-size: 0.95rem; color: var(--mint); }
        #connectionStatus { color: var(--muted-text); font-size: 0.82rem; white-space: nowrap; }
        #connectionStatus[data-state="error"] { color: var(--coral); }
        .source-actions { display: flex; gap: 0.5rem; }
        .source-actions button:first-child { color: var(--graphite); background: var(--mint); }
        .source-actions button:first-child:hover { background: var(--mint-strong); }
        .workspace { min-height: 420px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 1rem; }
        .viewer-panel, .filter-panel { border: 1px solid var(--line); border-radius: 8px; background: var(--graphite-soft); box-shadow: 0 10px 24px var(--shadow); }
        .viewer-panel { position: relative; min-height: 420px; display: grid; place-items: center; overflow: hidden; }
        #image { width: 100%; height: 100%; min-height: 420px; object-fit: contain; }
        .viewer-state { position: absolute; z-index: 1; max-width: 34rem; padding: 1rem; color: var(--muted-text); text-align: center; pointer-events: none; }
        .filter-panel { padding: 1rem; overflow-y: auto; }
        #filterGroups { display: grid; gap: 1rem; }
        .filter-group { display: grid; gap: 0.55rem; }
        .filter-group + .filter-group { padding-top: 0.9rem; border-top: 1px solid var(--line); }
        .filter-group-title { color: var(--muted-text); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
        .filter-control { display: grid; gap: 0.35rem; }
        .filter-control button { width: 100%; text-align: left; overflow-wrap: anywhere; }
        .filter-control label { color: var(--muted-text); font-size: 0.75rem; }
        .filter-control input { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 5px; padding: 0.45rem 0.6rem; color: var(--soft-text); background: var(--teal-surface); }
        .parameter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .check-row { display: flex; flex-wrap: wrap; gap: 0.55rem 0.9rem; color: var(--muted-text); font-size: 0.8rem; }
        .check-row label { display: inline-flex; align-items: center; gap: 0.35rem; }
        .confirm-button { color: var(--graphite); background: var(--mint); }
        .active-filters { min-height: 112px; padding: 0.9rem 0; border-top: 1px solid var(--line); }
        .section-heading { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.7rem; }
        #filterCount { display: inline-grid; place-items: center; min-width: 24px; min-height: 24px; border-radius: 50%; color: var(--graphite); background: var(--mint); font-size: 0.75rem; }
        #filters { display: flex; gap: 0.6rem; min-height: 54px; overflow-x: auto; padding-bottom: 0.2rem; }
        .empty-filters { align-self: center; color: var(--muted-text); font-size: 0.85rem; }
        .active-filter { display: flex; flex: 0 0 auto; align-items: center; gap: 0.7rem; min-width: 170px; max-width: 280px; min-height: 48px; padding: 0.45rem 0.5rem 0.45rem 0.8rem; border: 1px solid var(--line); border-radius: 6px; color: var(--soft-text); background: var(--teal-surface); }
        .active-filter-body { flex: 1; min-width: 0; min-height: 34px; padding: 0; overflow: hidden; border: 0; color: var(--soft-text); background: transparent; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
        .active-filter-body:hover { background: transparent; border-color: transparent; }
        .filter-remove { min-width: 34px; min-height: 34px; padding: 0; color: var(--coral); background: transparent; }
        .filter-remove:hover { color: var(--soft-text); background: var(--coral); }
        #statusMessage { min-height: 1.3rem; color: var(--muted-text); font-size: 0.85rem; }
        #statusMessage[data-state="error"] { color: var(--coral); }
        .hidden { display: none !important; }
        @media (max-width: 900px) {
            .app-shell { grid-template-rows: auto auto auto auto; }
            .app-header { grid-template-columns: 1fr auto; }
            #connectionStatus { grid-column: 1 / -1; grid-row: 2; }
            .source-actions { grid-column: 2; grid-row: 1; }
            .workspace { grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); }
        }
        @media (max-width: 700px) {
            .app-header { grid-template-columns: 1fr; }
            .source-actions, #connectionStatus { grid-column: auto; grid-row: auto; }
            .source-actions { flex-wrap: wrap; }
            .workspace { grid-template-columns: 1fr; }
            .viewer-panel, #image { min-height: 320px; }
            .filter-panel { max-height: 480px; }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div class="brand"><span class="brand-mark">PDI</span><h1>Image Workshop</h1></div>
            <div id="connectionStatus" role="status" aria-live="polite">Connecting</div>
            <div class="source-actions" aria-label="Image source">
                <button id="cameraToggle" type="button">Start camera</button>
                <button id="imageSelect" type="button">Load image</button>
            </div>
        </header>
        <section class="workspace" aria-label="Image processing workspace">
            <section class="viewer-panel" aria-label="Image viewer">
                <div id="viewerState" class="viewer-state">Load an image or start the camera</div>
                <img id="image" alt="Processed image preview">
            </section>
            <aside class="filter-panel" aria-label="Available filters">
                <div id="filterGroups">
                    <section class="filter-group" aria-labelledby="basic-title">
                        <h2 id="basic-title" class="filter-group-title">Basic adjustments</h2>
                        <div class="filter-control"><button type="button" data-filter="Grayscale">Grayscale</button></div>
                        <div class="filter-control"><button type="button" data-filter="Negative">Negative</button></div>
                        <div class="filter-control"><button type="button" data-filter="Threshold">Threshold</button><label for="kernelThreshold">Threshold value</label><input type="number" id="kernelThreshold" min="0" max="255" value="128" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Otsu">Otsu</button></div>
                    </section>
                    <section class="filter-group" aria-labelledby="edges-title">
                        <h2 id="edges-title" class="filter-group-title">Edges and smoothing</h2>
                        <div class="filter-control"><button type="button" data-filter="Mean">Mean smoothing</button><label for="kernelMean">Kernel size</label><input type="number" id="kernelMean" min="2" max="100" value="3" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Median">Median smoothing</button><label for="kernelMedian">Kernel size</label><input type="number" id="kernelMedian" min="2" max="100" value="3" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Canny">Canny</button><div class="parameter-row"><div><label for="canny1">Lower threshold</label><input type="number" id="canny1" min="0" max="255" value="5" class="hidden"></div><div><label for="canny2">Upper threshold</label><input type="number" id="canny2" min="0" max="255" value="50" class="hidden"></div></div><button id="canny3" type="button" class="confirm-button hidden">Apply Canny</button></div>
                    </section>
                    <section class="filter-group" aria-labelledby="morphology-title">
                        <h2 id="morphology-title" class="filter-group-title">Morphology</h2>
                        <div class="filter-control"><button type="button" data-filter="Erode">Erode</button><label for="kernelErode">Kernel size</label><input type="number" id="kernelErode" min="2" max="100" value="3" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Dilate">Dilate</button><label for="kernelDilate">Kernel size</label><input type="number" id="kernelDilate" min="2" max="100" value="3" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Opening">Opening</button><label for="kernelOpening">Kernel size</label><input type="number" id="kernelOpening" min="2" max="100" value="3" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Closing">Closing</button><label for="kernelClosing">Kernel size</label><input type="number" id="kernelClosing" min="2" max="100" value="3" class="hidden"></div>
                    </section>
                    <section class="filter-group" aria-labelledby="measurements-title">
                        <h2 id="measurements-title" class="filter-group-title">Measurements</h2>
                        <div class="filter-control"><button type="button" data-filter="Histogram">Histogram</button><div id="hist" class="check-row hidden"><label><input type="checkbox" id="hist1"> Cumulative</label><label><input type="checkbox" id="hist2"> Normalized</label></div><button id="hist3" type="button" class="confirm-button hidden">Apply histogram</button></div>
                        <div class="filter-control"><button type="button" data-filter="Area">Area</button><label for="kernelArea">Pixel size</label><input type="number" id="kernelArea" min="1" max="255" value="1" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Perimeter">Perimeter</button><label for="kernelPerimeter">Pixel size</label><input type="number" id="kernelPerimeter" min="1" max="255" value="1" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Diameter">Diameter</button><label for="kernelDiameter">Pixel size</label><input type="number" id="kernelDiameter" min="1" max="255" value="1" class="hidden"></div>
                        <div class="filter-control"><button type="button" data-filter="Counting">Object counting</button></div>
                    </section>
                    <section class="filter-group" aria-labelledby="tracking-title">
                        <h2 id="tracking-title" class="filter-group-title">Tracking</h2>
                        <div class="filter-control"><button type="button" data-filter="Tracking">Object tracking</button></div>
                    </section>
                </div>
            </aside>
        </section>
        <section class="active-filters" aria-labelledby="activeFiltersTitle">
            <div class="section-heading"><h2 id="activeFiltersTitle">Applied filters</h2><span id="filterCount">0</span></div>
            <div id="filters" role="list" aria-live="polite"><p class="empty-filters">No filters applied</p></div>
        </section>
        <p id="statusMessage" role="status" aria-live="polite"></p>
    </main>
    <input type="file" id="imageUpload" class="hidden" accept="image/*">
    <canvas id="captureCanvas" class="hidden"></canvas>
    <video id="cameraVideo" class="hidden" autoplay muted></video>

    <script type="module">
        import { createFilterState, formatFilterLabel, getNewDetectionIds, getViewerMessage, shouldShowProcessingFeedback } from './ui-state.mjs';

        const filterState = createFilterState();
        let canny1 = 5;
        let canny2 = 50;
        let hist1 = false;
        let hist2 = false;
        const imageUpload = document.getElementById('imageUpload');
        const imageObj = document.getElementById('image');
        const videoObj = document.getElementById('cameraVideo');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d');
        const connectionStatus = document.getElementById('connectionStatus');
        const viewerState = document.getElementById('viewerState');
        const statusMessage = document.getElementById('statusMessage');
        const viewerPanel = document.querySelector('.viewer-panel');
        const cameraToggle = document.getElementById('cameraToggle');
        const imageSelect = document.getElementById('imageSelect');
        let stream = null;
        let sendInterval = null;
        let sendTimer = 0;
        let originalImageUrl = '';
        let cameraReadyHandler = null;
        let resultImageUrl = '';
        let editingFilterIndex = null;
        let currentUiState = 'connecting';
        let previousDetectionIds = [];
        const detectionAudio = new Audio('./detection.mp3');

        function playDetectionAudio() {
            try {
                detectionAudio.currentTime = 0;
                const playback = detectionAudio.play();
                if (playback) playback.catch(() => {});
            } catch {}
        }

        function syncFilterButtonState(isBusy) {
            document.querySelectorAll('[data-filter], .confirm-button, .active-filter-body, .filter-remove')
                .forEach(button => { button.disabled = isBusy; });
        }

        function setUiState(state, message = '') {
            currentUiState = state;
            const defaultMessage = getViewerMessage(state);
            const hasImage = Boolean(imageObj.getAttribute('src')) || Boolean(stream);
            const isBusy = state === 'loading' || state === 'processing';
            const connectionMessages = { connecting: 'Connecting', ready: 'Connected', disconnected: 'Disconnected', error: 'Connection error' };
            connectionStatus.textContent = connectionMessages[state] || connectionStatus.textContent;
            connectionStatus.dataset.state = state;
            viewerPanel.setAttribute('aria-busy', String(isBusy));
            syncFilterButtonState(isBusy);
            statusMessage.textContent = message || defaultMessage;
            statusMessage.dataset.state = state === 'error' ? 'error' : '';
            viewerState.textContent = message || defaultMessage;
            const showViewerState = !hasImage || isBusy;
            viewerState.classList.toggle('hidden', !showViewerState);
        }

        function setStatus(message, state = '') { statusMessage.textContent = message; statusMessage.dataset.state = state; }
        function setTimer(ms) { sendTimer += ms / 1000; }

        setUiState('connecting');
        const ws = new WebSocket('ws:localhost:8080');
        ws.binaryType = 'blob';
        ws.addEventListener('open', () => { setUiState('ready'); ws.send(new Uint8Array([0])); });
        ws.addEventListener('close', () => { clearInterval(sendInterval); sendInterval = null; setUiState('disconnected'); });
        ws.addEventListener('error', () => { clearInterval(sendInterval); sendInterval = null; setUiState('error', 'Could not connect to the image processor.'); });
        ws.addEventListener('message', async event => {
            clearInterval(sendInterval);
            sendInterval = null;
            if (typeof event.data === 'string') {
                let message = event.data;
                try {
                    const payload = JSON.parse(event.data);
                    if (payload.type === 'detections') {
                        const objects = Array.isArray(payload.objects) ? payload.objects : [];
                        if (getNewDetectionIds(previousDetectionIds, objects).length > 0) playDetectionAudio();
                        previousDetectionIds = objects.map(object => object.id).filter(Boolean);
                        return;
                    }
                    message = payload.error || payload.message || event.data;
                } catch {}
                setUiState('error', message);
                return;
            }
            if (event.data instanceof Blob && event.data.type && !event.data.type.startsWith('image/png')) {
                setUiState('error', await event.data.text());
                return;
            }
            if (!(event.data instanceof Blob) && !(event.data instanceof ArrayBuffer)) {
                setUiState('error');
                return;
            }
            if (resultImageUrl) URL.revokeObjectURL(resultImageUrl);
            resultImageUrl = URL.createObjectURL(event.data);
            imageObj.src = resultImageUrl;
            setUiState('result');
            if (stream) scheduleVideoCapture();
        });

        function toggleCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                videoObj.srcObject = null;
                stream = null;
                previousDetectionIds = [];
                if (cameraReadyHandler) {
                    videoObj.removeEventListener('loadedmetadata', cameraReadyHandler);
                    videoObj.removeEventListener('playing', cameraReadyHandler);
                    cameraReadyHandler = null;
                }
                cameraToggle.textContent = 'Start camera';
                setUiState(originalImageUrl ? 'result' : 'ready', 'Camera stopped.');
                return;
            }
            setUiState('loading', 'Starting camera');
            navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(cameraStream => {
                if (originalImageUrl) URL.revokeObjectURL(originalImageUrl);
                originalImageUrl = '';
                previousDetectionIds = [];
                stream = cameraStream;
                videoObj.srcObject = stream;
                imageUpload.value = '';
                cameraToggle.textContent = 'Stop camera';
                setUiState('ready', 'Camera ready.');
                scheduleVideoCapture();
            }).catch(() => setUiState('error', 'Camera permission was not granted.'));
        }
        function selectImage() { if (stream) { stream.getTracks().forEach(track => track.stop()); videoObj.srcObject = null; stream = null; previousDetectionIds = []; cameraToggle.textContent = 'Start camera'; } imageUpload.click(); }
        function sendData(image, type) {
            const showProcessingFeedback = shouldShowProcessingFeedback(type);
            if (showProcessingFeedback) setUiState('loading');
            const reader = new FileReader();
            reader.onerror = () => setUiState('error', 'Could not load the image.');
            reader.onload = () => {
                const fileData = new Uint8Array(reader.result);
                const data = new Uint8Array(fileData.length + 1);
                data[0] = type;
                data.set(fileData, 1);
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                    clearInterval(sendInterval);
                    sendTimer = 0;
                    sendInterval = setInterval(() => setTimer(100), 100);
                    if (showProcessingFeedback) setUiState('processing');
                } else setUiState('error', 'Processor is unavailable.');
            };
            reader.readAsArrayBuffer(image);
        }
        function updateImage() {
            if (imageUpload.files.length === 0) return;
            previousDetectionIds = [];
            if (originalImageUrl) URL.revokeObjectURL(originalImageUrl);
            originalImageUrl = URL.createObjectURL(imageUpload.files[0]);
            imageObj.src = originalImageUrl;
            viewerState.classList.add('hidden');
            sendData(imageUpload.files[0], 1);
        }
        function hideParameters() { document.querySelectorAll('.filter-control input, .filter-control .check-row, .confirm-button').forEach(element => element.classList.add('hidden')); }
        function setFilter(filter) {
            if (!imageObj.getAttribute('src') && !stream) { setUiState('ready', 'Load an image or start the camera before applying a filter.'); return; }
            hideParameters();
            editingFilterIndex = null;
            if (filter === 'Canny') { document.getElementById('canny1').classList.remove('hidden'); document.getElementById('canny2').classList.remove('hidden'); document.getElementById('canny3').classList.remove('hidden'); }
            else if (filter === 'Histogram') { document.getElementById('hist').classList.remove('hidden'); document.getElementById('hist3').classList.remove('hidden'); }
            else if (['Mean', 'Median', 'Erode', 'Dilate', 'Opening', 'Closing', 'Area', 'Perimeter', 'Diameter', 'Threshold'].includes(filter)) document.getElementById(`kernel${filter}`).classList.remove('hidden');
            else addFilter(filter, [0, 0]);
        }
        function addFilter(filter, values) { filterState.addFilter(filter, values); renderActiveFilters(); sendFilters(); }
        function editFilterAt(index) {
            const filter = filterState.filters[index];
            if (!filter || !['Canny', 'Histogram', 'Mean', 'Median', 'Erode', 'Dilate', 'Opening', 'Closing', 'Area', 'Perimeter', 'Diameter', 'Threshold'].includes(filter.name)) return;
            editingFilterIndex = index;
            hideParameters();
            if (filter.name === 'Canny') {
                canny1 = filter.values[0] ?? 5;
                canny2 = filter.values[1] ?? 50;
                document.getElementById('canny1').value = canny1;
                document.getElementById('canny2').value = canny2;
                document.getElementById('canny1').classList.remove('hidden');
                document.getElementById('canny2').classList.remove('hidden');
                document.getElementById('canny3').classList.remove('hidden');
            } else if (filter.name === 'Histogram') {
                hist1 = Boolean(filter.values[0]);
                hist2 = Boolean(filter.values[1]);
                document.getElementById('hist1').checked = hist1;
                document.getElementById('hist2').checked = hist2;
                document.getElementById('hist').classList.remove('hidden');
                document.getElementById('hist3').classList.remove('hidden');
            } else {
                const input = document.getElementById(`kernel${filter.name}`);
                input.value = filter.values[0] ?? input.value;
                input.classList.remove('hidden');
            }
        }
        function commitFilter(filter, values) {
            if (editingFilterIndex === null) filterState.addFilter(filter, values);
            else filterState.updateFilter(editingFilterIndex, filter, values);
            editingFilterIndex = null;
            renderActiveFilters();
            sendFilters();
        }
        function createRemoveButton(filter, index) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'filter-remove';
            button.textContent = 'X';
            button.title = `Remove ${filter.name}`;
            button.setAttribute('aria-label', `Remove filter ${filter.name}`);
            button.addEventListener('click', event => {
                event.stopPropagation();
                removeFilterAt(index);
            });
            return button;
        }
        function renderActiveFilters() {
            const rail = document.getElementById('filters');
            rail.replaceChildren();
            const filters = filterState.filters;
            document.getElementById('filterCount').textContent = filters.length;
            if (filters.length === 0) { const empty = document.createElement('p'); empty.className = 'empty-filters'; empty.textContent = 'No filters applied'; rail.appendChild(empty); return; }
            filters.forEach((filter, index) => {
                const item = document.createElement('div');
                item.className = 'active-filter';
                item.setAttribute('role', 'listitem');
                const body = document.createElement('button');
                body.type = 'button';
                body.className = 'active-filter-body';
                body.textContent = formatFilterLabel(filter);
                body.title = `Edit ${filter.name}`;
                body.setAttribute('aria-label', `Edit filter ${filter.name}`);
                body.addEventListener('click', () => editFilterAt(index));
                item.appendChild(body);
                item.appendChild(createRemoveButton(filter, index));
                rail.appendChild(item);
            });
        }
        function updateViewerAfterFilterChange() {
            if (filterState.filters.length > 0) return;
            if (originalImageUrl) {
                imageObj.src = originalImageUrl;
                viewerState.classList.add('hidden');
            } else if (!stream) {
                imageObj.removeAttribute('src');
                viewerState.textContent = 'Load an image or start the camera';
                viewerState.classList.remove('hidden');
            }
        }
        function removeFilterAt(index) {
            filterState.removeFilter(index);
            renderActiveFilters();
            sendFilters();
            updateViewerAfterFilterChange();
        }
        function sendFilters() {
            if (!imageObj.getAttribute('src') && !stream) return;
            if (!filterState.filters.some(filter => filter.name === 'Tracking')) previousDetectionIds = [];
            const data = new Uint8Array(filterState.toPayload(filter => func2byte[filter]));
            if (ws.readyState === WebSocket.OPEN) { setUiState('processing'); ws.send(data); }
            else setUiState('error', 'Processor is unavailable.');
        }
        function scheduleVideoCapture() {
            if (!stream) return;
            if (videoObj.readyState >= 2) { requestAnimationFrame(sendVideoToServer); return; }
            if (cameraReadyHandler) return;
            cameraReadyHandler = () => {
                videoObj.removeEventListener('loadedmetadata', cameraReadyHandler);
                videoObj.removeEventListener('playing', cameraReadyHandler);
                cameraReadyHandler = null;
                if (stream) requestAnimationFrame(sendVideoToServer);
            };
            videoObj.addEventListener('loadedmetadata', cameraReadyHandler);
            videoObj.addEventListener('playing', cameraReadyHandler);
        }
        function sendVideoToServer() {
            if (!stream) return;
            if (videoObj.readyState < 2) { scheduleVideoCapture(); return; }
            canvas.width = videoObj.videoWidth; canvas.height = videoObj.videoHeight; ctx.drawImage(videoObj, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => { if (blob) sendData(blob, 2); }, 'image/png');
        }
        const func2byte = { Grayscale: 0, Negative: 1, Otsu: 2, Mean: 3, Median: 4, Canny: 5, Erode: 6, Dilate: 7, Opening: 8, Closing: 9, Histogram: 10, Area: 11, Perimeter: 12, Diameter: 13, Counting: 14, Threshold: 15, Tracking: 16 };
        cameraToggle.addEventListener('click', toggleCamera);
        imageSelect.addEventListener('click', selectImage);
        imageUpload.addEventListener('change', updateImage);
        document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => setFilter(button.dataset.filter)));
        document.getElementById('canny1').addEventListener('change', event => { canny1 = parseInt(event.target.value, 10); });
        document.getElementById('canny2').addEventListener('change', event => { canny2 = parseInt(event.target.value, 10); });
        document.getElementById('hist1').addEventListener('change', event => { hist1 = event.target.checked; });
        document.getElementById('hist2').addEventListener('change', event => { hist2 = event.target.checked; });
        document.getElementById('canny3').addEventListener('click', () => commitFilter('Canny', [canny1, canny2]));
        document.getElementById('hist3').addEventListener('click', () => commitFilter('Histogram', [hist1, hist2]));
        document.querySelectorAll('input[type="number"]').forEach(input => input.addEventListener('change', event => {
            if (!event.target.value) return;
            const filter = event.target.id.replace('kernel', '');
            if (func2byte[filter] === undefined) return;
            const values = [parseInt(event.target.value, 10)];
            if (editingFilterIndex === null) addFilter(filter, values);
            else commitFilter(filter, values);
        }));
    </script>
</body>
</html>
